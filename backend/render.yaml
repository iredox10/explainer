services:
  - type: web
    name: explainer-api
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: starter
    healthCheckPath: /health
    preDeployCommand: npx drizzle-kit migrate
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: explainer-db
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: TRUSTED_ORIGINS
        sync: false
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PUBLIC_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: CRON_SECRET
        generateValue: true
      - key: INTERNAL_API_KEY
        generateValue: true

  - type: cron
    name: explainer-scheduled-publish
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    schedule: '*/10 * * * *'
    command: >-
      node -e "fetch(process.env.BETTER_AUTH_URL + '/api/cron/publish-scheduled',
      {headers: {authorization: 'Bearer ' + process.env.CRON_SECRET}}).then(r =>
      r.text()).then(console.log)"
    envVars:
      - key: BETTER_AUTH_URL
        sync: false
      - key: CRON_SECRET
        fromService:
          type: web
          name: explainer-api
          envVarKey: CRON_SECRET

databases:
  - name: explainer-db
    plan: basic-256mb
    databaseName: explainer
    user: explainer
