services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: explainer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - explainer_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d explainer']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  explainer_pgdata:
